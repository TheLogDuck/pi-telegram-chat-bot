[project]
name = "pi-telegram-chat-bot"
version = "1.0.0"
description = "Edge-optimized asynchronous AI Telegram bot running on Raspberry Pi 3B+"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
# Define where pytest should discover unit tests
testpaths = ["tests"]
# Recognize standard test module naming conventions
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Verbose test reporting to view individual test pass/fail status
addopts = "-v"

[tool.ruff]
# Target Python 3.11 runtime features
target-version = "py311"
# Standard readable line length
line-length = 120

[tool.ruff.lint]
# E = pycodestyle syntax & whitespace errors
# F = pyflakes (detects undefined variables, syntax errors, and broken code)
select = ["E", "F"]
ignore = [
    "E501",  # Line too long (allows long prompts, URLs, and documentation)
    "E402",  # Module level import not at top of file (required for load_dotenv() in main.py)
    "F401",  # Unused imports (common in package __init__.py files)
    "F841",  # Unused local variables (common in mock unpacking)
]

[tool.ruff.lint.per-file-ignores]
# Unit tests frequently import test fixtures, mocks, and unused test helpers
"tests/*" = ["E", "F", "W"]
"__init__.py" = ["F401"]

